<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gaspar — economia pessoal</title>
<meta name="theme-color" content="#05070D">
<meta name="description" content="Controle de entradas, gastos fixos, variáveis e idas ao mercado.">
<link rel="manifest" href="manifest.webmanifest">
<script>(function(){var t;try{t=localStorage.getItem("feira_tema")}catch(e){}if(t!=="dark"&&t!=="light")t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;})();</script>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0EA; --paper-2:#E3E8DF; --ink:#17302A; --ink-soft:#5B6B66; --line:#D3DACF;
  --green:#2E6A4C; --green-soft:#D7E7DC; --plum:#8E3B5F; --plum-soft:#F0DDE5;
  --tag:#F2CB3D; --white:#FFFFFF; --thermal:#3E4744;
  --r-s:8px; --r-m:14px; --r-l:22px;
  --sans:"Bricolage Grotesque",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100dvh}
.nav{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--ink);color:#fff;display:flex;justify-content:space-around;padding:6px 6px calc(6px + var(--safe-b))}
.nav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;color:#B9C8C2;text-decoration:none;font-size:12px;font-weight:500;border-radius:12px}
.nav a svg{width:24px;height:24px}
.nav a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.08)}
.nav .brand{display:none}
.nav .lg{display:none}
main{padding:0 18px calc(110px + var(--safe-b));max-width:760px;width:100%;margin:0 auto}
@media (min-width:900px){
  .shell{grid-template-columns:220px minmax(0,1fr)}
  .nav{position:sticky;top:0;height:100dvh;flex-direction:column;justify-content:flex-start;gap:4px;padding:28px 14px}
  .nav a{flex:0;flex-direction:row;gap:12px;font-size:16px;padding:12px 14px}
  .nav .lg{display:inline}.nav .sm{display:none}
  .nav .brand{display:block;font-weight:800;font-size:28px;letter-spacing:-.02em;color:#fff;padding:0 14px 26px}
  .nav .brand small{display:block;font-weight:400;font-size:13px;color:#9FB3AB;letter-spacing:0}
  main{padding:0 40px 60px}
}

/* ---------- Top bar ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px;padding:22px 0 14px}
.top h1{margin:0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.025em}
.month{display:flex;align-items:center;gap:2px;background:var(--white);border-radius:999px;padding:3px;border:1px solid var(--line)}
.month button{border:0;background:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.month button:hover{background:var(--paper)}
.month span{min-width:118px;text-align:center;font-weight:600;font-size:15px;white-space:nowrap}
.sync{font-size:13px;color:var(--plum);background:var(--plum-soft);padding:6px 12px;border-radius:999px;margin:0 0 12px;display:inline-block}

/* ---------- Generic ---------- */
h2{font-size:20px;letter-spacing:-.01em;margin:30px 0 10px;font-weight:700}
.muted{color:var(--ink-soft)}
.btn{border:0;border-radius:999px;padding:13px 18px;white-space:nowrap;font-weight:600;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn.green{background:var(--green)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--plum);border:1.5px solid var(--plum-soft)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:18px;bottom:calc(88px + var(--safe-b));z-index:15;box-shadow:0 10px 30px -10px rgba(23,48,42,.55);padding:16px 22px}
@media (min-width:900px){.fab{bottom:32px;right:40px}}
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:10px;padding:14px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:14px;color:var(--ink-soft)}
.row .v{font-weight:700;white-space:nowrap}
.row .trash{margin-left:-6px;width:36px}
.row .t{white-space:normal;overflow-wrap:anywhere}
.row .v + .trash{margin-left:0}
.in{color:var(--green)} .out{color:var(--plum)}
.empty{padding:34px 4px;color:var(--ink-soft)}
.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.seg{display:flex;background:var(--paper-2);border-radius:999px;padding:4px;gap:4px;margin:4px 0 8px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:10px 6px;font-weight:600;font-size:15px;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--ink);box-shadow:0 1px 2px rgba(23,48,42,.12)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--white);display:grid;place-items:center;flex:none;padding:0}
.check[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.icon{width:42px;height:42px;border-radius:12px;background:var(--white);display:grid;place-items:center;font-size:20px;flex:none}

/* ---------- Resumo ---------- */
.hero{padding:6px 0 4px}
.hero .lbl{font-size:16px;color:var(--ink-soft)}
.hero .big{font-size:clamp(46px,12vw,72px);font-weight:800;letter-spacing:-.04em;line-height:1}
.split{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--paper-2);margin:20px 0 14px}
.split i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:0;padding:0;list-style:none}
.legend li{display:flex;flex-direction:column;font-size:14px;color:var(--ink-soft);padding-left:14px;position:relative}
.legend li::before{content:"";position:absolute;left:0;top:6px;width:8px;height:8px;border-radius:50%;background:var(--c)}
.legend b{font-size:18px;color:var(--ink)}
.bars .row{display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.bars .bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.bars .bar i{display:block;height:100%;background:var(--green)}


/* ---------- Dashboard ---------- */
.kpis{list-style:none;margin:18px 0 6px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.kpis li{display:flex;flex-direction:column;border-top:1.5px solid var(--line);padding-top:8px}
.kpis span{font-size:14px;color:var(--ink-soft)}
.kpis b{font-size:20px;letter-spacing:-.01em}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpis.kpis3{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpis3 b{font-size:clamp(15px,4.4vw,20px)}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 8px}
.ringcard{border:0;font:inherit;text-align:left;width:100%;background:var(--white);border-radius:var(--r-l);padding:14px 12px 16px;color:inherit;text-decoration:none;display:flex;flex-direction:column;align-items:center}
.ringcard h2{margin:0 0 6px;font-size:16px;align-self:flex-start}
.ringwrap{position:relative;width:100%;max-width:190px}
.ring{width:100%;height:auto;display:block}
.ring .seg{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1),stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring-v{font-family:var(--sans);font-weight:800;fill:var(--ink)}
.ring-p{font-family:var(--sans);font-size:11px;fill:var(--ink-soft)}
.bump{position:absolute;top:-8px;right:-6px;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;animation:bump 2.4s ease-out forwards}
@keyframes bump{0%{transform:translateY(8px);opacity:0}15%{transform:none;opacity:1}75%{opacity:1}100%{opacity:0}}
.leg{list-style:none;margin:8px 0 0;padding:0;font-size:13px;color:var(--ink-soft);align-self:stretch}
.leg li{display:flex;align-items:center;gap:6px;margin-top:3px}
.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.bars2 .brow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.bars2 .brow:last-child{border-bottom:0}
.bars2 .bv{font-weight:600}
.bars2 .bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.bars2 .bar i{display:block;height:100%;border-radius:99px}
details.sub{margin-top:6px;background:var(--white);border-radius:var(--r-m);padding:4px 14px}
details.sub summary{cursor:pointer;font-weight:600;padding:10px 0}
.tag{flex:none;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,white);min-width:66px;text-align:center}

/* ---------- Meses pagos ---------- */
.row.fx{flex-wrap:wrap;row-gap:8px}
.mchips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;flex-basis:100%;padding-left:38px}
@media (min-width:700px){.mchips{grid-template-columns:repeat(12,minmax(0,1fr))}}
.mchip{font-size:11.5px;font-weight:600;line-height:1;padding:5px 2px;border-radius:999px;border:1.5px solid transparent;text-align:center;white-space:nowrap}
.mlegend{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.mlegend .mchip{padding:5px 9px}
.mchip.none{color:#A9B3AF;border:1.5px dashed var(--line)}
.mchip.cur{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--ink)}
.mchip.ok{background:var(--green);color:#fff}
.mchip.late{background:var(--plum-soft);color:var(--plum);border-color:var(--plum-soft)}
.mchip.wait{background:transparent;color:var(--ink-soft);border-color:var(--line)}
.mchip.just{animation:paid .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes paid{0%{transform:scale(.6)}100%{transform:none}}
/* ---------- Variáveis tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{border:1.5px solid transparent;background:var(--white);border-radius:var(--r-m);padding:9px 8px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;min-height:78px}
.tile .ti{font-size:20px;line-height:1.1}
.tile .tn{font-size:13.5px;font-weight:600;line-height:1.2;margin-top:4px}
.tile .tv{font-size:13px;color:var(--ink);font-weight:600;margin-top:auto;padding-top:4px}
.tile.zero .tv,.tile.zero .tc{opacity:.6}
.tile .tc{font-size:12px;color:var(--ink-soft)}
.tile[aria-selected="true"] .tc{color:#C9D6D1}
.tile[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tile[aria-selected="true"] .tv{color:#C9D6D1;opacity:1}
#varSec{scroll-margin-top:12px;margin-top:26px}
/* ---------- Mercado list ---------- */
.trip{display:flex;gap:14px;align-items:center;width:100%;padding:14px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.trip .date{width:52px;flex:none;text-align:center;background:var(--white);border-radius:12px;padding:6px 0;line-height:1.1}
.trip .date b{display:block;font-size:22px;font-weight:800}
.tripwrap{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.tripwrap .trip{border-bottom:0;flex:1;min-width:0}
.trip .t{overflow-wrap:anywhere;line-height:1.25}
.trash{flex:none;width:42px;height:44px;margin-left:2px;border:0;background:none;color:var(--ink-soft);border-radius:12px;display:grid;place-items:center}
.trash:hover{background:var(--plum-soft);color:var(--plum)}
.btn.danger.solid{background:var(--plum);color:#fff;border-color:var(--plum)}
.trip .date span{font-size:12px;color:var(--ink-soft);text-transform:lowercase}

/* ---------- Receipt (the one bold thing) ---------- */
.receipt{background:var(--white);color:var(--thermal);font-family:var(--mono);font-size:14.5px;padding:24px 20px 34px;margin:6px 0 20px;position:relative;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%;
  box-shadow:0 1px 0 var(--line)}
.receipt header{text-align:center;border-bottom:1px dashed #B8BFBC;padding-bottom:14px;margin-bottom:6px}
.receipt header .store{font-weight:600;font-size:17px;color:var(--ink);text-transform:uppercase;letter-spacing:.06em;background:none;border:0;font-family:inherit;padding:2px 6px}
.receipt header .when{font-size:13.5px;background:none;border:0;font-family:inherit;color:inherit;padding:2px 6px}
.receipt .cat{margin:16px 0 4px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between}
.receipt .cat span:last-child{font-weight:500;color:var(--thermal)}
.item{display:block;width:100%;border:0;background:none;text-align:left;font-family:inherit;color:inherit;padding:7px 0;border-radius:6px}
.item:hover{background:#F6F7F4}
.itemrow{display:flex;align-items:flex-start;gap:2px}
.itemrow .item{flex:1;min-width:0}
.ibtn{flex:none;width:40px;height:40px;border:0;background:none;color:var(--ink-soft);border-radius:10px;display:grid;place-items:center;margin-top:1px}
.ibtn:hover{background:var(--paper-2);color:var(--ink)}
.ibtn.del:hover{background:var(--plum-soft);color:var(--plum)}
.receipt header.editing{text-align:left;font-family:var(--sans);color:var(--ink)}
.receipt header.editing .grid2{grid-template-columns:1.4fr 1fr}
.receipt header.editing input{font-size:16px;padding:10px 12px}
.edithint{background:var(--tag);color:#3A3000;border-radius:10px;padding:8px 12px;font-size:14px;margin:0 0 14px}
.item .l1{display:flex;gap:6px;align-items:baseline}
.item .l1 .name{color:var(--ink);font-weight:500}
.item .l1 .dots{flex:1;border-bottom:1.5px dotted #B8BFBC;transform:translateY(-4px)}
.item .l1 .tot{font-weight:600;color:var(--ink)}
.item .l2{font-size:13px;color:#7A8380;margin-top:1px}
.pricetag{background:var(--tag);color:#3A3000;font-weight:600;padding:0 6px;border-radius:4px}
.receipt .sum{border-top:1px dashed #B8BFBC;margin-top:16px;padding-top:12px;display:flex;justify-content:space-between;font-size:20px;font-weight:600;color:var(--ink)}
.receipt .count{font-size:13px;text-align:right}

/* ---------- Sheet (dialog) ---------- */
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);width:100%;max-width:560px;border-radius:var(--r-l) var(--r-l) 0 0;margin:auto auto 0;max-height:92dvh}
dialog::backdrop{background:rgba(23,48,42,.45)}
dialog[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.3}}
@media (min-width:700px){dialog{border-radius:var(--r-l);margin:auto}}
.sheet{padding:22px 20px calc(22px + var(--safe-b))}
.sheet h3{margin:0 0 16px;font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{border:0;background:var(--paper-2);width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.lbl2{font-size:14px;font-weight:600;color:var(--ink-soft)}
.field input,.field select{border:1.5px solid var(--line);background:var(--white);border-radius:var(--r-m);padding:12px 14px;min-height:50px;width:100%}
.field input:focus,.field select:focus{border-color:var(--ink);outline:none}
.field .hint{font-size:13.5px;color:var(--ink-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.total-in input{font-size:24px;font-weight:700}
dialog{overflow:hidden}
.sheet{max-height:92dvh;overflow-y:auto;overscroll-behavior:contain}
.catpick{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;border:1.5px solid var(--line);background:var(--white);border-radius:var(--r-m);padding:8px 14px 8px 8px;text-align:left;font-weight:600}
.catpick .icon{width:40px;height:40px;background:var(--paper);font-size:20px}
.catpick.empty .grow{color:var(--ink-soft);font-weight:500}
.catpick .grow,.catopt .grow{flex:1;min-width:0}
.catpick .chev{font-size:24px;color:var(--ink-soft);line-height:1}
.picker{display:flex;flex-direction:column;height:min(78dvh,680px)}
.picker h3 button[data-back]{font-size:24px}
.catlist{list-style:none;margin:0 -6px;padding:0 6px;overflow-y:auto;flex:1;overscroll-behavior:contain}
.catopt{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;text-align:left;padding:8px 6px;border-radius:12px;min-height:56px}
.catopt:hover{background:var(--paper-2)}
.catopt[aria-pressed="true"]{background:var(--white)}
.catopt .icon{width:42px;height:42px;font-size:21px}
.catopt .t{display:block;font-weight:600}
.catopt .s{display:block;font-size:13.5px;color:var(--ink-soft)}
.catopt .tick{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.actions .btn{flex:1 1 auto}
.last{background:var(--tag);color:#3A3000;border-radius:10px;padding:8px 12px;font-size:14px;margin:-4px 0 14px}

/* ---------- Pop-up de confirmação ---------- */
#pop{margin:auto;border-radius:var(--r-l);max-width:360px;width:calc(100% - 40px);background:var(--white)}
#pop[open]{animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.popbox{padding:24px 22px 20px;text-align:center}
.popicon{width:56px;height:56px;border-radius:50%;background:var(--plum-soft);color:var(--plum);display:grid;place-items:center;margin:0 auto 14px}
.popicon svg{width:26px;height:26px}
.popicon.safe{background:var(--green-soft);color:var(--green)}
.popicon.warn{background:#FBF0C9;color:#7A5B00}
.popbox h3{margin:0 0 8px;font-size:20px;line-height:1.25;letter-spacing:-.01em}
.popbox p{margin:0 0 20px;color:var(--ink-soft);font-size:15.5px}
.popbox p b{color:var(--ink)}
.popact{display:flex;flex-direction:column;gap:8px}
.popact .btn{width:100%}
/* ---------- Calma visual: menos ruído ---------- */
h2{font-size:17px;font-weight:700;margin:0 0 6px}
.block{margin-top:30px}
.bhead{display:flex;justify-content:space-between;align-items:baseline}
.hero{padding:2px 0 0}
.hero-sub{margin:10px 0 0;color:var(--ink-soft);font-size:15px}
.hero-sub b{color:var(--ink);font-weight:600}
.note{color:var(--ink-soft);font-size:14px;margin:10px 0 0}
.more{display:inline-block;border:0;background:none;color:var(--green);font-weight:600;font-size:14.5px;padding:10px 0 0;text-decoration:none}
.rows .row{padding:12px 0}
.row .s{font-size:13.5px}
.row .v{font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.ra{display:flex;flex:none;margin-right:-8px}
.ib{width:34px;height:40px;border:0;background:none;color:#A3AEAA;display:grid;place-items:center;border-radius:10px}
.ib svg{width:18px;height:18px}
.ib:hover,.ib:focus-visible{color:var(--ink);background:var(--paper-2)}
.ib[data-act^="askDel"]:hover{color:var(--plum);background:var(--plum-soft)}
.tripwrap{border-bottom:1px solid var(--line)}
.trip{padding:12px 0}
.rings{margin:24px 0 0;gap:10px}
.ringcard{padding:14px 10px 14px}
.ringcard h2{font-size:15px;margin:0 0 4px 4px}
.leg{display:flex;gap:12px;justify-content:center;margin-top:6px}
.leg li{margin:0}
/* faixa dos 12 meses */
.mstrip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;flex-basis:100%;padding-left:38px;margin-top:-2px}
.mc{display:block;font-size:10.5px;font-weight:600;line-height:18px;height:18px;text-align:center;border-radius:5px;color:#A9B3AF;background:transparent}
.mc.ok{background:var(--green);color:#fff}
.mc.late{background:var(--plum-soft);color:var(--plum)}
.mc.wait{background:var(--paper-2);color:var(--ink-soft)}
.mc.none{opacity:.55}
.mc.cur{outline:1.5px solid var(--ink);outline-offset:1px}
button.mc{border:0;padding:0;font:inherit;font-size:10.5px;font-weight:600;cursor:pointer;width:100%;-webkit-tap-highlight-color:transparent}button.mc:hover{filter:brightness(.95)}button.mc:active{transform:scale(.92)}button.mc:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.mc.just{animation:paid .5s cubic-bezier(.2,.9,.3,1.4)}
.mlegend{display:flex;gap:14px;margin:6px 0 0;font-size:13px;color:var(--ink-soft)}
.mlegend span{display:flex;align-items:center;gap:6px}
.mlegend .mc{width:12px;height:12px;border-radius:3px}
/* abas de variáveis */
.tile{min-height:70px}
.tile .tn{font-size:13.5px}
.more-tile{background:transparent;border:1.5px dashed var(--line)}
.more-tile .tv{font-size:12px}
/* categorias em grade */
.catgrid{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (min-width:700px){.catgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.catcell{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--white);border-radius:12px;padding:10px 10px;text-align:left;min-height:48px}
.catcell .ci{font-size:18px;flex:none}
.catcell .cn{flex:1;min-width:0;font-weight:500;font-size:14.5px;line-height:1.25}
.kg{font-size:11px;font-weight:700;background:var(--tag);color:#3A3000;border-radius:5px;padding:2px 5px}
details.sub{margin-top:18px}
/* ---------- Comparativo e etapas ---------- */
.dl{font-size:12.5px;font-weight:600;white-space:nowrap;padding:2px 7px;border-radius:999px}
.dl.bad{color:var(--plum);background:var(--plum-soft)}
.dl.good{color:var(--green);background:var(--green-soft)}
.dl.eq,.dl.new{color:var(--ink-soft);background:var(--paper-2)}
.hero-sub .dl{margin-left:2px}
.rdelta{margin-top:8px;min-height:22px}
.cleg{display:flex;gap:12px;font-size:12.5px;color:var(--ink-soft)}
.cleg span{display:flex;align-items:center;gap:5px}
.sw{width:14px;height:8px;border-radius:3px;background:var(--ink)}
.sw.prv{opacity:.28}
.cmp{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:16px}
.ch{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px;margin-bottom:6px}
.cb{display:flex;align-items:center;gap:8px;margin-top:3px}
.cb i{display:block;height:10px;border-radius:3px;min-width:2px}
.cb i.prv{opacity:.28;height:7px}
.cb b{font-size:13.5px;font-weight:600}
.cb span{font-size:12.5px;color:var(--ink-soft)}
.etapas{list-style:none;margin:4px 0 0;padding:0}
.erow{display:grid;grid-template-columns:1fr auto;gap:5px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow .en{font-weight:500}
.erow .ev{font-weight:600;text-align:right}
.erow .bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.erow .bar i{display:block;height:100%;border-radius:99px}
.erow .ed{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:20px}
.erow .ep{font-size:12.5px;color:var(--ink-soft);margin-left:auto}
.bhead b{font-size:16px}
.cgroup{list-style:none}
.csubs{list-style:none;margin:12px 0 0 0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.csub .ch{font-weight:500;font-size:14px;margin-bottom:4px}
.csub .cb i{height:7px}
.csub .cb i.prv{height:5px}
.csub .cb b{font-size:13px}
.csub .cb span{font-size:12px}
/* ---------- Auth ---------- */
.auth{min-height:100dvh;display:grid;place-items:center;padding:24px}
.auth .box{width:100%;max-width:400px}
.auth .logo{font-size:56px;font-weight:800;letter-spacing:-.05em;line-height:1}
.auth p.lead{font-size:18px;color:var(--ink-soft);margin:8px 0 28px;max-width:32ch}
.msg{padding:12px 14px;border-radius:var(--r-m);margin-bottom:14px;font-size:15px}
.msg.err{background:var(--plum-soft);color:var(--plum)}
.msg.ok{background:var(--green-soft);color:var(--green)}
.link{background:none;border:0;color:var(--green);font-weight:600;padding:8px 0;text-decoration:underline;text-underline-offset:3px}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;z-index:50;font-size:15px;max-width:90vw}
.loading{padding:60px 0;text-align:center;color:var(--ink-soft)}

/* =====================================================================
   PREMIUM — camada visual final
   ===================================================================== */
:root{
  --paper:#F2F3EF; --paper-2:#E8EBE5; --ink:#0F2420; --ink-soft:#66746F; --line:#E1E5DE;
  --green:#1F5C45; --green-soft:#DCEBE2; --plum:#8C3457; --plum-soft:#F4E3EA;
  --gold:#B8955A; --gold-soft:#F3EBDD;
  --sans:"Geist",system-ui,sans-serif; --serif:"Instrument Serif",Georgia,serif;
  --card:#FFFFFF; --r-l:24px; --r-m:16px;
  --shadow:0 1px 2px rgba(15,36,32,.04),0 12px 32px -16px rgba(15,36,32,.18);
}
html,body{font-family:var(--sans);font-size:16.5px;letter-spacing:-.005em;background:var(--paper)}
/* títulos com serifa */
.top{padding:26px 0 18px}
.top h1{font-family:var(--serif);font-weight:400;font-size:40px;letter-spacing:-.01em;line-height:1}
h2{font-weight:600;font-size:15px;letter-spacing:.005em;color:var(--ink)}
.month{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.month span{font-weight:500}
/* navegação */
.nav{background:var(--ink)}
.nav a{color:#93A49E;font-weight:500}
.nav a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.06);position:relative}
.nav a[aria-current="page"]::after{content:"";position:absolute;top:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--gold)}
@media (min-width:900px){
  .shell{grid-template-columns:236px minmax(0,1fr)}
  .nav{padding:34px 16px;border-right:1px solid rgba(255,255,255,.04)}
  .nav a{white-space:nowrap}
  .nav .brand{font-family:var(--serif);font-weight:400;font-size:38px;letter-spacing:0;padding-bottom:34px}
  .nav .brand small{font-family:var(--sans);font-size:12.5px;color:#7F918B;letter-spacing:.02em;margin-top:4px}
  .nav a[aria-current="page"]::after{top:50%;left:6px;margin:-2px 0 0}
  main{padding:0 48px 64px}
}
/* hero do resumo: cartão escuro */
.hero{background:radial-gradient(120% 140% at 100% 0%,#24584A 0%,#12342C 45%,#0C211C 100%);color:#fff;border-radius:var(--r-l);padding:24px 22px 22px;box-shadow:0 24px 48px -24px rgba(12,33,28,.55);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(255,255,255,.08);pointer-events:none}
.hero .lbl{color:#A9BDB5;font-size:14px;letter-spacing:.01em}
.hero .big{font-family:var(--serif);font-weight:400;letter-spacing:-.01em;font-size:clamp(52px,14vw,80px);line-height:1.02;margin-top:4px}
.hero .big.in{color:#fff}
.hero .big.out{color:#F3B6CB}
.hero-sub{color:#A9BDB5}
.hero-sub b{color:#fff}
.hero .dl.good{background:rgba(159,224,190,.14);color:#A8E6C4}
.hero .dl.bad{background:rgba(243,182,203,.14);color:#F3B6CB}
.hero .dl.eq,.hero .dl.new{background:rgba(255,255,255,.08);color:#C9D6D1}
/* cartões */
.ringcard,.tile,.catcell,.receipt,details.sub{box-shadow:var(--shadow)}
.ringcard{border:1px solid rgba(15,36,32,.04);border-radius:var(--r-l)}
.ringcard h2{font-weight:600}
.ring-v{font-family:var(--sans);font-weight:700}
main .rows,main .etapas,main .cmp{background:var(--card);border-radius:var(--r-l);padding:4px 18px;box-shadow:var(--shadow);border:1px solid rgba(15,36,32,.04)}
main .cmp{padding:18px}
main details.sub .rows{box-shadow:none;border:0;padding:0}
details.sub{background:var(--card);border-radius:var(--r-l);padding:4px 18px;border:1px solid rgba(15,36,32,.04)}
.rows .row,.erow{border-color:#EEF0EC}
.block{margin-top:34px}
.bhead{margin-bottom:10px}
.bhead h2,.block>h2{margin:0}
.block>h2{margin-bottom:10px}
.kpis li{border-top:0;background:var(--card);border-radius:var(--r-m);padding:12px 14px;box-shadow:var(--shadow)}
.kpis span{font-size:12.5px;letter-spacing:.01em}
.kpis.kpis3{gap:8px}
.kpis.kpis3 li{padding:10px 10px;min-width:0}
.kpis3 b{font-size:clamp(14px,3.9vw,19px);white-space:nowrap}
.kpis b{font-weight:600}
/* abas de variáveis */
.tile{border:1px solid rgba(15,36,32,.04);border-radius:18px}
.tile[aria-selected="true"]{background:linear-gradient(160deg,#1C4A3D,#0F2420);border-color:transparent;box-shadow:0 14px 28px -14px rgba(15,36,32,.6)}
.tile[aria-selected="true"] .tv{color:#E7D2AA}
.tile .tn{font-weight:600}
/* faixa de meses e chips */
.mc.ok{background:var(--green)}
.mc.cur{outline-color:var(--gold)}
.dl.good{background:var(--green-soft);color:var(--green)}
/* botões */
.btn{font-weight:600;letter-spacing:.005em}
.btn.green,.fab{background:var(--ink);color:#fff}
.btn.green:hover,.fab:hover{background:#163A31}
.fab{box-shadow:0 16px 32px -14px rgba(15,36,32,.7);padding:16px 24px}
.fab::first-letter{color:var(--gold)}
.btn.ghost{border:1px solid var(--line);background:var(--card)}
.check[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
/* folhas e pop-ups */
dialog{background:var(--paper)}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:0}
.popbox h3{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:0;line-height:1.15}
.field input,.field select,.catpick{border:1px solid var(--line);box-shadow:0 1px 2px rgba(15,36,32,.03)}
.field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.seg{background:var(--paper-2)}
:focus-visible{outline-color:var(--gold)}
/* tela de entrada */
.auth .logo{font-family:var(--serif);font-weight:400;font-size:72px;letter-spacing:0}
.auth{background:radial-gradient(90% 60% at 50% 0%,#E6ECE4 0%,var(--paper) 70%)}
/* cupom continua sendo o destaque do mercado */
.receipt{border-radius:4px 4px 0 0}
.cat span:first-child,.receipt header .store{letter-spacing:.04em}

/* fonte original (Bricolage Grotesque) */
:root{--sans:"Bricolage Grotesque",system-ui,sans-serif;--serif:"Bricolage Grotesque",system-ui,sans-serif}
html,body{font-size:17px;letter-spacing:0}
.top h1{font-weight:800;font-size:30px;letter-spacing:-.025em;line-height:1.1}
.hero .big{font-weight:800;letter-spacing:-.04em;font-size:clamp(46px,12vw,72px);line-height:1}
.sheet h3{font-weight:800;font-size:22px;letter-spacing:-.02em}
.popbox h3{font-weight:700;font-size:20px;letter-spacing:-.01em;line-height:1.25}
.auth .logo{font-weight:800;font-size:56px;letter-spacing:-.05em}
@media (min-width:900px){.nav .brand{font-weight:800;font-size:28px;letter-spacing:-.02em}}
h2{font-weight:700}

/* =====================================================================
   CORES: preto profundo + azul elétrico (referência enviada)
   ===================================================================== */
:root{
  --paper:#F3F5FA; --paper-2:#E6EAF3; --ink:#05070D; --ink-soft:#5E6A80; --line:#DEE3EE;
  --blue:#2563EB; --blue-2:#3B82F6; --blue-glow:rgba(37,99,235,.55); --blue-soft:#E2EBFF;
  --green:#15803D; --green-soft:#DCF5E4; --plum:#B4235A; --plum-soft:#FCE4EC;
  --gold:var(--blue); --gold-soft:var(--blue-soft);
  --shadow:0 1px 2px rgba(5,7,13,.04),0 12px 32px -16px rgba(5,7,13,.22);
}
.nav{background:var(--ink)}
.nav a{color:#8C97AD}
.nav a[aria-current="page"]{color:#fff;background:rgba(37,99,235,.16)}
.nav a[aria-current="page"]::after{background:var(--blue-2);box-shadow:0 0 8px 2px var(--blue-glow)}

[data-theme="dark"] .themebtn:hover{color:#7AA5FF;border-color:#3B82F6}
/* o cupom continua papel branco no escuro */
[data-theme="dark"] .receipt{--ink:#05070D;--white:#FFFFFF;--line:#DEE3EE;background:#fff;color:#3E4744}
[data-theme="dark"] .receipt header.editing .field input{background:#fff;color:#05070D;border-color:#DEE3EE}
[data-theme="dark"] .item:hover{background:#F3F5F8}

/* ---------- Poupança e limite ---------- */
.pouprow{display:grid;gap:12px}
@media (min-width:700px){.pouprow{grid-template-columns:1fr 1fr}}
.metacard,.lim{background:var(--card);border-radius:var(--r-l);padding:16px 18px;box-shadow:var(--shadow);border:1px solid rgba(15,36,32,.04)}
.metacard h2{margin:0}
.metav{margin:10px 0 8px}
.metav b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.metav span{color:var(--ink-soft);font-size:14px}
.metabar,.limbar{height:10px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.metabar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),#60A5FA);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.metacard.done .metabar i{background:linear-gradient(90deg,var(--green),#4ADE80)}
.metas{margin:10px 0 0;font-size:14.5px;color:var(--ink-soft)}
.metas b{color:var(--ink)}
.metacard .actions{margin-top:14px}
.limt{font-size:17px;font-weight:600}
.limt b{font-weight:800}
.lims{margin:4px 0 12px;color:var(--ink-soft);font-size:14.5px}
.lims b{color:var(--ink)}
.limbar i{display:block;height:100%;border-radius:99px;background:var(--green)}
.lim.warn .limbar i{background:#D97706}
.lim.over .limbar i{background:var(--plum)}
.lim.over{border-color:var(--plum-soft)}
.lim.over .limt b{color:var(--plum)}
.limc{margin:8px 0 0;font-size:12.5px;color:var(--ink-soft)}
.limwarn{margin:10px 0 0;padding:8px 12px;border-radius:12px;background:#FEF3C7;color:#7A4B00;font-size:14px}
[data-theme="dark"] .limwarn{background:rgba(217,119,6,.16);color:#FCD38A}
.hintbox{margin:0 0 14px;padding:10px 14px;border-radius:14px;background:var(--blue-soft);font-size:14.5px}
.hintbox.warn{background:#FEF3C7;color:#7A4B00}
[data-theme="dark"] .hintbox.warn{background:rgba(217,119,6,.16);color:#FCD38A}
.check.out-c{display:grid;place-items:center;color:var(--plum);font-weight:800;border-color:var(--plum-soft)}
.catcell .chev{color:var(--ink-soft);font-size:20px}
.catcell .ci svg{width:20px;height:20px;color:var(--blue)}
.popicon.warn svg{width:26px;height:26px}

/* ---------- Salário e projeção ---------- */
.salcard,.projcard{background:var(--card);border-radius:var(--r-l);padding:18px;box-shadow:var(--shadow);border:1px solid rgba(15,36,32,.04)}
.salcard{background:radial-gradient(120% 140% at 100% 0%,rgba(37,99,235,.10),transparent 60%),var(--card)}
.salt{font-size:15px;color:var(--ink-soft)}
.salt b{color:var(--ink)}
.salv{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:4px 0 6px;color:var(--blue)}
.salv span{font-size:14px;font-weight:500;color:var(--ink-soft);letter-spacing:0}
.sals{margin:0;font-size:14.5px;color:var(--ink-soft)}
.sals b{color:var(--ink)}
.salcard .actions{margin-top:14px}
.salcard .btn{text-decoration:none}
.projcard h2{margin:0}
.tag-r{font-size:12px;font-weight:600;color:var(--blue);background:var(--blue-soft);padding:3px 9px;border-radius:999px}
.projs{margin:10px 0 2px;font-size:14.5px;color:var(--ink-soft)}
.projs b{color:var(--ink)}
.projv{font-size:36px;font-weight:800;letter-spacing:-.03em}
.projd{margin:2px 0 14px;font-size:14px;color:var(--ink-soft)}
.projd .plus{color:var(--green);font-weight:600}
.projbars{display:flex;align-items:flex-end;gap:4px;height:90px}
.projbars i{flex:1;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--blue-2,#3B82F6),var(--blue));min-height:4px;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.projbars i:hover{filter:brightness(1.15)}
.projx{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:6px}
.projr{margin:12px 0 0;font-size:14.5px}

/* ---------- Plano de poupança ---------- */
:root{--cg:#2563EB;--cr:#15803D}
[data-theme="dark"]{--cg:#3B82F6;--cr:#22A55A}
.plancard{background:var(--card);border-radius:var(--r-l);padding:18px;box-shadow:var(--shadow);border:1px solid rgba(15,36,32,.04);margin-top:10px}
.salin{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-m);padding:4px 14px;margin-top:6px;background:var(--paper)}
.salin span{font-weight:700;color:var(--ink-soft);font-size:20px}
.salin input{border:0;background:transparent;font:inherit;font-size:30px;font-weight:800;letter-spacing:-.02em;width:100%;padding:8px 0;color:var(--ink);outline:none}
.salin:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.plancard .hint{font-size:13px;color:var(--ink-soft);margin:6px 0 0}
.pcthead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.rec{font-size:12px;font-weight:700;color:var(--green);background:var(--green-soft);padding:3px 9px;border-radius:999px;white-space:nowrap;flex:none}
.pctval{display:flex;align-items:baseline;gap:10px;margin:6px 0 10px}
.pctval b{font-size:40px;font-weight:800;letter-spacing:-.03em;color:var(--blue)}
.pctval span{font-size:17px;font-weight:600}
#pctIn{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--blue) var(--p),var(--paper-2) var(--p));outline:none;margin:6px 0}
#pctIn::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--blue);box-shadow:0 4px 12px -2px rgba(37,99,235,.5);cursor:pointer}
#pctIn::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--blue);cursor:pointer}
#pctIn:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--blue-soft)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);padding:0 2px}
.ticks span.r{color:var(--green);font-weight:700}
.pctmsg{margin:12px 0 0;font-size:14.5px;color:var(--ink-soft)}
.anos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:end;height:260px;background:var(--card);border-radius:var(--r-l);padding:18px 14px 12px;box-shadow:var(--shadow);border:1px solid rgba(15,36,32,.04);margin-top:10px}
.ano{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.anov{font-size:clamp(10.5px,2.9vw,12.5px);font-weight:700;white-space:nowrap}
.anobar{width:100%;max-width:56px;display:flex;flex-direction:column;border-radius:8px 8px 4px 4px;overflow:hidden;gap:2px;transition:height .5s cubic-bezier(.2,.8,.2,1);min-height:6px}
.anobar i{display:block;min-height:2px}
.anobar i.g{background:var(--cg)}
.anobar i.r{background:var(--cr)}
.anol{font-size:12.5px;font-weight:600;margin-top:4px}
.anor{font-size:11px;color:var(--cr);font-weight:600;white-space:nowrap}

/* ---------- Depósitos por mês ---------- */
.depos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
@media (min-width:700px){.depos{grid-template-columns:repeat(6,minmax(0,1fr))}}
.dep{background:var(--card);border-radius:14px;padding:10px 12px;border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.dep .dm{font-size:12.5px;font-weight:600;color:var(--ink-soft);text-transform:capitalize}
.dep b{font-size:clamp(12px,3.4vw,14.5px);font-weight:700;white-space:nowrap;letter-spacing:-.01em}
.dep{padding:10px 8px 10px 10px}
.dep .ds{font-size:11.5px;color:var(--ink-soft);min-height:15px}
.dep.ok{border-color:transparent;background:var(--green-soft)}
.dep.ok .ds{color:var(--green);font-weight:600}
.dep.late .ds{color:var(--plum);font-weight:600}
.dep.none b{color:var(--ink-soft);font-weight:500}
.dep.prev{border-style:dashed}
.dep.prev b{color:var(--ink-soft)}
.dep.cur{outline:2px solid var(--blue);outline-offset:1px}

.dep{font:inherit;text-align:left;cursor:pointer;position:relative;color:inherit}
.dep:hover{border-color:var(--blue)}
.dep .de{position:absolute;top:8px;right:8px;color:var(--ink-soft);opacity:.55}
.dep .de svg{width:14px;height:14px}
.dep.none .ds{font-size:10.5px}

/* ---------- Login ---------- */
.pwbox{position:relative}
.pwbox input{padding-right:84px}
.pwtoggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--blue);font-weight:600;font-size:14px;padding:8px 10px;border-radius:10px}
.auth .pwtoggle{color:#7AA5FF}
.pwrules{list-style:none;margin:-4px 0 14px;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--ink-soft)}
.auth .pwrules{color:#8C97AD}
.pwrules li.ok{color:var(--green);font-weight:600}
.auth .pwrules li.ok{color:#86EFAC}
.pwmatch{margin:-6px 0 14px;font-size:13.5px;min-height:18px;color:#FF9DBD}
.pwmatch.ok{color:#86EFAC}
#fSenha .pwmatch{color:var(--plum)}
#fSenha .pwmatch.ok,#fSenha .pwrules li.ok{color:var(--green)}
.authh{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:0 0 10px;color:#fff}
.mailicon{font-size:44px;margin-bottom:10px}
.authalt{margin-top:18px}
.auth .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.18)}
.auth .btn:disabled{opacity:.55}
.previewhint{margin-top:14px;font-size:13px;background:rgba(242,203,61,.12);color:#F7E08A;padding:8px 12px;border-radius:10px}
.auth .link{display:inline-block}

.otp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;max-width:360px}
.otpd{height:58px;border-radius:14px;border:1px solid #1F2B47;background:#0C1222;color:#fff;text-align:center;font:inherit;font-size:26px;font-weight:800;padding:0;outline:none;caret-color:#7AA5FF}
.otpd:focus{border-color:#3B82F6;box-shadow:0 0 0 3px rgba(59,130,246,.3)}

/* ---------- Saudação ---------- */
.topl{min-width:0}
.ola{margin:0 0 4px;font-size:15px;color:var(--ink-soft);font-weight:500}
.ola b{color:var(--ink);font-weight:700}
.chipsug{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;margin-top:-4px}

.box.centro{text-align:center}
.box.centro .authh{white-space:nowrap;font-size:clamp(18px,5.4vw,25px);letter-spacing:-.02em}
.box.centro .lead{margin-left:auto;margin-right:auto}
.box.centro .field label{text-align:center}
.box.centro .field input{text-align:center;font-size:18px}
.box.centro .chipsug{display:inline-block;margin:-4px auto 0}

/* ---------- Idioma ---------- */
.langbtn{height:42px;padding:0 12px 0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:700;box-shadow:var(--shadow);flex:none}
.langbtn svg{width:18px;height:18px}
.langbtn:hover{border-color:var(--blue);color:var(--blue)}
.authtema{display:flex;gap:8px}
.auth .langbtn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.langlist{list-style:none;margin:0;padding:0}

/* ===== Conta (canto inferior esquerdo) ===== */
.uwrap{flex:1;min-width:0;display:flex}
.ubtn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:0;background:none;color:#8C97AD;font:inherit;font-size:12px;font-weight:500;border-radius:12px;cursor:pointer}
.ubtn[aria-current="page"],.ubtn[aria-expanded="true"]{color:#fff;background:rgba(37,99,235,.16)}
.uav{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:700;font-size:12.5px;flex:none}
.un{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uch{display:none}
.umenu{position:fixed;z-index:40;right:8px;bottom:calc(78px + var(--safe-b));width:min(290px,calc(100vw - 16px));background:#111827;color:#E6EAF2;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:6px;box-shadow:0 24px 48px -12px rgba(0,0,0,.55);animation:umIn .16s ease-out}
.umenu[hidden]{display:none}
@keyframes umIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.umail{font-size:13px;color:#8C97AD;padding:8px 12px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .umenu a,.umenu a,.umenu button{flex:none;flex-direction:row;white-space:nowrap;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:none;color:inherit;font:inherit;font-size:15px;font-weight:500;text-align:left;text-decoration:none;border-radius:10px;cursor:pointer}
.nav .umenu a[aria-current],.nav .umenu a::after{background:none;content:none}
.umenu a:hover,.umenu button:hover,.umenu a:focus-visible,.umenu button:focus-visible{background:rgba(255,255,255,.07);outline:none}
.umenu svg,.nav .umenu a svg{width:19px;height:19px;flex:none;color:#AEB8CC}
.umenu .grow{flex:1;min-width:0}
.uval{font-size:13px;color:#8C97AD}
.umenu hr{border:0;border-top:1px solid rgba(255,255,255,.08);margin:6px 4px}
@media (min-width:900px){
  .uwrap{flex:none;margin-top:auto;position:relative}
  .ubtn{flex-direction:row;gap:10px;padding:10px 12px;font-size:15px;font-weight:600;color:#E6EAF2;text-align:left;border:1px solid transparent}
  .ubtn:hover{background:rgba(255,255,255,.06)}
  .uav{width:30px;height:30px;font-size:14px}
  .un{flex:1}
  .uch{display:block;color:#8C97AD}.uch svg{width:16px;height:16px;display:block}
  .umenu{position:absolute;left:0;right:auto;bottom:calc(100% + 8px);width:100%;min-width:240px}
}

/* ===== Subcategorias de variáveis no menu lateral ===== */
.subnav{display:none}
@media (min-width:900px){
  .nav{overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
  .subnav{display:flex;flex-direction:column;gap:1px;margin:2px 0 8px 24px;padding-left:8px;border-left:1px solid rgba(255,255,255,.08)}
  .nav .subnav a{flex:none;display:flex;flex-direction:row;align-items:center;gap:9px;padding:6px 10px;font-size:13.5px;font-weight:500;color:#AEB8CC;border-radius:9px;white-space:nowrap;min-width:0}
  .nav .subnav a::after{content:none}
  .nav .subnav a:hover{background:rgba(255,255,255,.05);color:#fff}
  .nav .subnav a[aria-current="true"]{background:rgba(37,99,235,.18);color:#fff}
  .nav .subnav a.zero{color:#6B768C}
  .subnav .si{font-size:14px;width:18px;text-align:center;flex:none}
  .subnav .sn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .subnav .sv{font-size:12px;color:#8C97AD;flex:none}
  .subnav a[aria-current="true"] .sv{color:#C9D6FF}
  .subnav a.zero .sv{color:#4F5A70}
  .tiles{display:none}
  .shell{grid-template-columns:280px minmax(0,1fr)}
  .uwrap{position:sticky;bottom:-34px;padding:14px 16px 34px;margin:auto -16px -34px;background:linear-gradient(rgba(5,7,13,0),#05070D 35%)}
  [data-theme="dark"] .uwrap{background:linear-gradient(rgba(3,5,10,0),#03050A 35%)}
}

/* espaço no fim da página para o botão flutuante não cobrir o último item */
main{padding-bottom:calc(176px + var(--safe-b))}
@media (min-width:900px){main{padding-bottom:128px}}

/* Gasto fixo: cabe ou não no mês */
.cabe{font-size:14.5px;line-height:1.45;padding:12px 14px;border-radius:12px;background:var(--paper-2);color:var(--ink-soft);margin:0 0 14px}
.cabe b{color:var(--ink)}
.cabe.ok{background:#E7F6EC;color:#166534}.cabe.ok b{color:#14532D}
.cabe.no{background:#FCE7F0;color:#9D174D}.cabe.no b{color:#831843}
[data-theme="dark"] .cabe.ok{background:rgba(31,138,76,.16);color:#86EFAC}[data-theme="dark"] .cabe.ok b{color:#BBF7D0}
[data-theme="dark"] .cabe.no{background:rgba(219,39,119,.14);color:#F9A8D4}[data-theme="dark"] .cabe.no b{color:#FBCFE8}

/* ===== Agenda (rotina) ===== */
.agnow{position:relative;overflow:hidden;border-radius:var(--r-l);padding:18px 20px;background:radial-gradient(120% 140% at 100% 0%,rgba(37,99,235,.35),transparent 60%),#05070D;color:#fff;margin-bottom:16px}
.agnow .k{font-size:13px;color:#9FB0D0;display:flex;align-items:center;gap:8px}
.agnow .k i{width:8px;height:8px;border-radius:50%;background:var(--c,#3B82F6);box-shadow:0 0 0 4px color-mix(in srgb,var(--c,#3B82F6) 30%,transparent)}
.agnow .k i.live{animation:agpulse 1.6s ease-in-out infinite}
@keyframes agpulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--c,#3B82F6) 10%,transparent)}}
.agnow .tt{font-size:24px;font-weight:700;letter-spacing:-.01em;margin:6px 0 2px;line-height:1.2}
.agnow .hh{font-size:15px;color:#C9D3E6}
.agnow .bar{height:4px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:12px;overflow:hidden}.agnow .bar b{display:block;height:100%;background:var(--c,#3B82F6);border-radius:4px}
.agnow .rest{display:flex;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);font-size:13.5px;color:#9FB0D0;flex-wrap:wrap}
.agnow .rest b{color:#fff;font-weight:600}
.agtop{display:flex;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.agtop .lbl{font-weight:700;font-size:17px;flex:1;min-width:140px}
.agseg{display:inline-flex;background:var(--paper-2);border-radius:99px;padding:3px}
.agseg button{border:0;background:none;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink-soft);padding:6px 12px;border-radius:99px;cursor:pointer}
.agseg button[aria-pressed="true"]{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(5,7,13,.12)}
.agarw{width:34px;height:34px;border-radius:50%;border:0;background:var(--white);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 2px rgba(5,7,13,.06)}
.agarw svg{width:18px;height:18px}
.aghoje{border:0;background:var(--white);font:inherit;font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:99px;cursor:pointer;color:var(--blue);box-shadow:0 1px 2px rgba(5,7,13,.06)}
.agweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:16px}
.agwd{border:0;background:var(--white);border-radius:16px;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;color:var(--ink);cursor:pointer;box-shadow:0 1px 2px rgba(5,7,13,.05)}
.agwd .w{font-size:11.5px;font-weight:600;color:var(--ink-soft);text-transform:capitalize}
.agwd .n{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.agwd .dots{display:flex;gap:3px;height:6px}.agwd .dots i{width:5px;height:5px;border-radius:50%}
.agwd.hoje .n{color:var(--blue)}
.agwd[aria-pressed="true"]{background:var(--blue);color:#fff}.agwd[aria-pressed="true"] .w{color:#C9D6FF}.agwd[aria-pressed="true"] .n{color:#fff}.agwd[aria-pressed="true"] .dots i{box-shadow:0 0 0 1.5px #fff}
.agcal{background:var(--white);border-radius:var(--r-l);padding:12px 10px 10px;margin-bottom:16px}
.agsem,.aggrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.agsem span{text-align:center;font-size:12px;font-weight:600;color:var(--ink-soft);padding-bottom:6px;text-transform:capitalize}
.agd{aspect-ratio:1/1;max-height:58px;border:0;background:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:inherit;color:var(--ink);cursor:pointer;padding:0}

function loadCache() { try { const c = JSON.parse(localStorage.getItem(cacheKey()) || "null"); if (!c) return false; Object.assign(S, { perfil: c.perfil, poupMov: c.poupMov || [], entradasHist: c.entradasHist || [], prev: c.prev, histFixos: c.histFixos || [], categorias: c.categorias, recorrencias: c.recorrencias, lancamentos: c.lancamentos, compras: c.compras, itens: c.itens, eventos: c.eventos || [] }); S.historico = new Map(c.hist || []); return true; } catch { return false; } }

/* ===================== Offline queue ===================== */
const QK = () => `feira_queue_${S.user?.id}`;
const getQ = () => JSON.parse(localStorage.getItem(QK()) || "[]");
const setQ = q => localStorage.setItem(QK(), JSON.stringify(q));
const isNetErr = e => !navigator.onLine || /fetch|network|load failed|timeout/i.test(e?.message || "");
async function runOp(op) {
  let r;
  if (op.t === "insert") r = await sb.from(op.table).insert(op.row);
  else if (op.t === "update") r = await sb.from(op.table).update(op.row).eq("id", op.id);
  else if (op.t === "upsert") r = await sb.from(op.table).upsert(op.row);
  else r = await sb.from(op.table).delete().eq("id", op.id);
  if (r.error) throw r.error;
}
async function write(op) {
  if (navigator.onLine && getQ().length === 0) {
    try { await runOp(op); return; } catch (e) { if (!isNetErr(e)) { toast("Não foi possível salvar: " + e.message); throw e; } }
  }
  const q = getQ(); q.push(op); setQ(q); renderSync();
}
let flushing = false;
async function flush() {
  if (flushing || !navigator.onLine) return; flushing = true;
  let q = getQ();
  while (q.length) {
    try { await runOp(q[0]); } catch (e) { if (isNetErr(e)) break; toast("Um lançamento offline foi descartado: " + e.message); }
    q.shift(); setQ(q);
  }
  flushing = false; renderSync();
}
window.addEventListener("online", () => flush().then(() => loadMonth()));
function renderSync() { const el = $("#sync"); if (!el) return; const n = getQ().length; el.classList.toggle("hidden", n === 0); el.textContent = n === 1 ? "1 alteração aguardando internet" : `${n} alterações aguardando internet`; }

async function loadAll() {
  const [c, r, h, pf, pm, eh] = await Promise.all([
    sb.from("categorias").select("*").order("ordem"),
    sb.from("recorrencias").select("*").order("created_at"),
    sb.from("v_historico_precos").select("produto_chave,produto,modo,categoria_id,preco,data,mercado").order("data", { ascending: false }).limit(1500),
    sb.from("perfis").select("*"),
    sb.from("lancamentos").select("id,tipo,valor,data,pago,descricao,recorrencia_id").in("tipo", ["guardar", "resgatar"]),
    sb.from("lancamentos").select("data,valor").eq("tipo", "entrada"),
  ]);
  { const ev = await sb.from("eventos").select("*").order("data"); S.agendaErro = !!ev.error; S.eventos = ev.data || []; }
  if (!GRATUITO) { const as = await sb.rpc("iniciar_teste"); S.assinErro = !!as.error; S.assin = as.error ? null : (as.data?.[0] || null); } else S.assin = null;
  S.perfil = pf.data?.[0] || null; S.poupMov = pm.data || []; S.entradasHist = eh.data || [];
  if (c.error) throw c.error;
  S.categorias = c.data; S.recorrencias = r.data || [];
  S.historico = new Map(); for (const x of h.data || []) if (!S.historico.has(x.produto_chave)) S.historico.set(x.produto_chave, x);
}
async function loadMonth() {
  const a = monthStart(S.month), b = monthEnd(S.month);
  try {
    if (navigator.onLine) await flush();
    S.gerados ||= new Set();
    const y = S.month.getFullYear();
    const iniRec = S.recorrencias.filter(r => r.ativo !== false).map(r => r.inicio).sort()[0];
    for (let m = 0; m <= S.month.getMonth() && temAcesso(); m++) {
      const ms = monthStart(new Date(y, m, 1));
      if (S.gerados.has(ms) || !iniRec || ms < monthStart(dParts(iniRec))) continue;
      await sb.rpc("gerar_recorrencias", { mes: ms }); S.gerados.add(ms);
    }
    if (!S.gerados.has(a) && temAcesso()) { await sb.rpc("gerar_recorrencias", { mes: a }); S.gerados.add(a); }
    const hf = await sb.from("lancamentos").select("id,recorrencia_id,pago,data,descricao").in("tipo", ["saida_fixa", "guardar"]).gte("data", `${y}-01-01`).lte("data", `${y}-12-31`);
    S.histFixos = hf.data || [];
    const [l, c] = await Promise.all([
      sb.from("lancamentos").select("*").gte("data", a).lte("data", b).order("data"),
      sb.from("compras").select("*").gte("data", a).lte("data", b).order("data", { ascending: false }),
    ]);
    if (l.error) throw l.error;
    S.lancamentos = l.data; S.compras = c.data;
    // mês anterior (comparativo)
    const pmD = new Date(S.month.getFullYear(), S.month.getMonth() - 1, 1), pa = monthStart(pmD), pb = monthEnd(pmD);
    if (!S.gerados.has(pa) && iniRec && pa >= monthStart(dParts(iniRec))) { await sb.rpc("gerar_recorrencias", { mes: pa }); S.gerados.add(pa); }
    const [lp, cp] = await Promise.all([
      sb.from("lancamentos").select("tipo,valor,categoria_id").gte("data", pa).lte("data", pb),
      sb.from("compras").select("id").gte("data", pa).lte("data", pb),
    ]);
    const prev = { entradas: 0, fixos: 0, variaveis: 0, mercado: 0, porCat: { saida_fixa: {}, saida_variavel: {} } };
    for (const x of lp.data || []) {
      const v = Number(x.valor);
      if (x.tipo === "entrada") prev.entradas += v; else if (x.tipo === "saida_fixa") prev.fixos += v; else if (x.tipo === "saida_variavel") prev.variaveis += v; else if (x.tipo === "guardar") prev.fixos += v; else continue;
      if (x.tipo === "guardar") { prev.porCat.saida_fixa.__poup = (prev.porCat.saida_fixa.__poup || 0) + v; continue; }
      if (x.tipo !== "entrada") { const m = prev.porCat[x.tipo]; m[x.categoria_id || "_"] = (m[x.categoria_id || "_"] || 0) + v; }
    }
    const pids = (cp.data || []).map(x => x.id);
    if (pids.length) { const pit = await sb.from("compra_itens").select("total,compra_id").in("compra_id", pids); for (const i of pit.data || []) prev.mercado += Number(i.total); }
    S.prev = prev;
    const ids = S.compras.map(x => x.id);
    S.itens = {};
    if (ids.length) {
      const it = await sb.from("compra_itens").select("*").in("compra_id", ids).order("created_at");
      for (const i of it.data || []) (S.itens[i.compra_id] ||= []).push(i);
    }
    saveCache();
  } catch (e) {
    if (!isNetErr(e)) toast(e.message);
    loadCache();
  }
  render();
}

const TRAD_IDX = { en: new Map(), es: new Map() }, TRAD_RX = { en: [], es: [] };
function montarTraducao() {
  const esc = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const pat = { m: "((?:R\\$\\s?-?[\\d.,]+(?:\\s?(?:mil|K|M))?)|(?:-?[\\d.,]+\\s?(?:mil\\s)?R\\$))", n: "(-?[\\d.,]+)", d: "(\\d{1,2}/\\d{1,2})", x: "(.+?)" };
  for (const [pt, en, es] of TRAD) {
    if (/\{[mndx]\}/.test(pt)) {
      const rx = new RegExp("^" + esc(pt).replace(/\\\{([mndx])\\\}/g, (_, k) => pat[k]) + "$");
      const f = pt.replace(/\{[mndx]\}/g, "").length; TRAD_RX.en.push([rx, en, f]); TRAD_RX.es.push([rx, es, f]);
    } else { TRAD_IDX.en.set(pt, en); TRAD_IDX.es.set(pt, es); }
  }
  // modelos com mais texto fixo primeiro, para "{x}: {m}" não engolir frases maiores
  for (const l of ["en", "es"]) TRAD_RX[l].sort((a, b) => b[2] - a[2]);
}
function traduzTexto(t) {
  if (LANG === "pt" || !t) return t;
  const lead = t.match(/^\s*/)[0], trail = t.match(/\s*$/)[0], core = t.trim();
  if (!core) return t;
  const idx = TRAD_IDX[LANG];
  let r = idx.get(core);
  if (r == null) {
    // emoji/ícone na frente: "🥩 Açougue"
    const m = core.match(/^([^\p{L}\p{N}"“(]+)(.+)$/u);
    if (m && idx.has(m[2])) r = m[1] + idx.get(m[2]);
  }
  if (r == null) for (const [rx, tr] of TRAD_RX[LANG]) { const m = core.match(rx); if (m) { let i = 1; r = tr.replace(/\{([mndx])\}/g, (_, k) => { const v = m[i++] ?? ""; return k === "x" && v !== core ? traduzTexto(v) : v; }); break; } }
  return r == null ? t : lead + r + trail;
}
const ATTRS = ["placeholder", "aria-label", "title"];
function traduzArvore(raiz) {
  if (LANG === "pt" || !raiz) return;
  if (raiz.nodeType === 3) { if (raiz.parentNode?.closest?.('[translate="no"]')) return; const n = traduzTexto(raiz.data); if (n !== raiz.data) raiz.data = n; return; }
  if (raiz.nodeType !== 1) return;
  const w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, { acceptNode: n => /^(SCRIPT|STYLE)$/.test(n.parentNode?.nodeName) || n.parentNode?.closest?.('[translate="no"]') ? 2 : 1 });
  const nos = []; while (w.nextNode()) nos.push(w.currentNode);
  for (const n of nos) { const t = traduzTexto(n.data); if (t !== n.data) n.data = t; }
  const els = raiz.querySelectorAll ? [raiz, ...raiz.querySelectorAll("[placeholder],[aria-label],[title]")] : [];
  for (const el of els) for (const a of ATTRS) if (el.hasAttribute?.(a)) { const v = el.getAttribute(a), t = traduzTexto(v); if (t !== v) el.setAttribute(a, t); }
}
new MutationObserver(ms => { if (LANG === "pt") return; for (const m of ms) { if (m.type === "attributes") { const v = m.target.getAttribute(m.attributeName), t = traduzTexto(v); if (t !== v) m.target.setAttribute(m.attributeName, t); } else m.addedNodes.forEach(traduzArvore); } })
  .observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ATTRS });
function trocarIdioma(l) {
  if (!IDIOMAS[l]) return;
  LANG = l; LOC = IDIOMAS[l].loc; brl = new Intl.NumberFormat(LOC, { style: "currency", currency: "BRL", currencyDisplay: "narrowSymbol" }); calcMeses();
  document.documentElement.lang = LOC; try { localStorage.setItem("gaspar_lang", l); } catch {}
  if ($("#sheet").open) closeSheet();
  if (S.user && S.loaded) render(); else renderAuth();
  traduzArvore(document.body);
  toast({ pt: "Idioma: Português", en: "Language: English", es: "Idioma: Español" }[l]);
}

function render() {
  if (!S.user || S.recuperando) return renderAuth();
  if (S.loaded && !aceitouPolitica()) return renderPolitica();
  if (S.loaded && !nomeUsuario() && !S.pulouNome) return renderNome();
  if (S.loaded && S.assin && !temAcesso()) return renderBloqueio();
  if (!S.loaded) { $("#app").innerHTML = '<div class="loading">Carregando…</div>'; return; }
  const [r, id] = route();
  if (S.editCompra && S.editCompra !== id) S.editCompra = null;
  let html;
  if (r === "mercado" && id) html = viewCompra(id);
  else if (r === "mercado") { location.replace("#/variaveis/mercado"); return; }

function traduz(m) {
  if (/Invalid login/i.test(m)) return "E-mail ou senha incorretos.";
  if (/not confirmed/i.test(m)) return "Confirme seu e-mail pelo link que enviamos antes de entrar.";
  if (/already registered|already been registered/i.test(m)) return "Esse e-mail já tem conta. Use Entrar.";
  if (/rate limit|too many/i.test(m)) return "Muitas tentativas seguidas. Espere alguns minutos e tente de novo.";
  if (/not authorized/i.test(m)) return "O envio de e-mails para este endereço ainda não foi liberado no servidor do Gaspar.";
  if (/weak|at least|should contain|characters/i.test(m)) return "Senha fraca: use 8 caracteres ou mais, com letras e números.";
  if (/same.*password|different from the old/i.test(m)) return "A senha nova precisa ser diferente da atual.";
  if (/expired|invalid.*(link|token|otp)/i.test(m)) return "O link expirou ou já foi usado. Peça um novo.";
  return m;
}

/* ===================== Resumo ===================== */
function totals() {
  const sum = t => S.lancamentos.filter(l => l.tipo === t).reduce((s, l) => s + Number(l.valor), 0);
  const poupFixo = sum("guardar");                              // depósito na poupança = gasto fixo do mês
  const entradas = sum("entrada"), fixos = sum("saida_fixa") + poupFixo, variaveis = sum("saida_variavel");
  const mercado = S.compras.reduce((s, c) => s + compraTotal(c.id), 0);
  return { entradas, fixos, poupFixo, variaveis, mercado, saldo: entradas - fixos - variaveis - mercado };
}
const COR = { fixos: "#2563EB", poup: "#A21CAF", mercado: "#B7791F", outros: "#0E8F7E" };
S.prevRing = S.prevRing || {};
function donut(key, { total, base, segs, label }) {
  const r = 54, C = 2 * Math.PI * r, sw = 15;
  const prev = S.prevRing[key] || { segs: segs.map(() => [0, 0]), total: 0 };
  let acc = 0;
  const geo = segs.map(s => { const len = Math.max(0, Math.min(s.value / (base || 1) * C, C - acc)); const g = [acc, len]; acc += len; return g; });
  const gap = l => l > 3 ? l - 2 : l;
  const pct = base ? Math.round(total / base * 100) : null;
  const delta = total - (prev.total || 0);
  const html = `<svg viewBox="0 0 140 140" class="ring" role="img" aria-label="${esc(label)}: ${money(total)}${pct != null ? `, ${pct}% da renda` : ""}">
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--paper-2)" stroke-width="${sw}"/>
    ${segs.map((s, i) => { const [p0, l0] = prev.segs[i] || [0, 0]; return `<circle class="seg" data-ring="${key}" data-i="${i}" cx="70" cy="70" r="${r}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-linecap="butt" transform="rotate(-90 70 70)" stroke-dasharray="${gap(l0)} ${C}" stroke-dashoffset="${-p0}" data-to="${gap(geo[i][1])} ${C}|${-geo[i][0]}"><title>${esc(s.label)}: ${money(s.value)}</title></circle>`; }).join("")}
    <text x="70" y="${pct != null ? 68 : 75}" text-anchor="middle" class="ring-v num" style="font-size:${Math.min(16, 132 / money(total).length).toFixed(1)}px">${money(total)}</text>
    ${pct != null ? `<text x="70" y="88" text-anchor="middle" class="ring-p num">${pct}% da renda</text>` : ""}
  </svg>${prev.total && delta > 0.004 ? `<span class="bump num">+ ${money(delta)}</span>` : ""}`;
  S.prevRing[key] = { segs: geo, total };
  return html;
}
function animateRings() {
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll(".ring .seg").forEach(c => { const [da, off] = c.dataset.to.split("|"); c.setAttribute("stroke-dasharray", da); c.setAttribute("stroke-dashoffset", off); })));
}
function viewResumo() {
  const t = totals();
  const P = S.prev || { entradas: 0, fixos: 0, variaveis: 0, mercado: 0, porCat: {} };
  const gastos = t.fixos + t.variaveis + t.mercado;
  const varTot = t.mercado + t.variaveis, varPrev = P.mercado + P.variaveis;
  const prevSaldo = P.entradas - P.fixos - P.variaveis - P.mercado;
  const base = t.entradas || gastos;
  const mesNome = d => d.toLocaleDateString(LOC, { month: "long" });
  const pm = new Date(S.month.getFullYear(), S.month.getMonth() - 1, 1);
  const curN = mesNome(S.month), prevN = mesNome(pm);
  const temPrev = P.entradas || P.fixos || P.variaveis || P.mercado;
  // variação: para gastos, subir é ruim; para entradas e sobra, subir é bom
  const delta = (cur, prev, bomSubir = false) => {
    if (!temPrev) return "";
    cur = round2(cur); prev = round2(prev);
    if (!prev && !cur) return "";
    if (!prev) return `<span class="dl new">novo</span>`;
    const d = cur - prev; if (Math.abs(d) < 0.005) return `<span class="dl eq">igual</span>`;
    const pct = Math.round(Math.abs(d) / Math.abs(prev) * 100);
    const bom = (d > 0) === bomSubir;
    return `<span class="dl ${bom ? "good" : "bad"}" title="${d > 0 ? "mais" : "menos"} que em ${prevN}">${d > 0 ? "▲" : "▼"} ${money(Math.abs(d))}${pct ? ` · ${pct}%` : ""}</span>`;
  };
  const sumCat = (tipo, src) => { const m = new Map(); for (const l of src) { const k = l.tipo === tipo ? (l.categoria_id || "_") : tipo === "saida_fixa" && l.tipo === "guardar" ? "__poup" : null; if (k) m.set(k, (m.get(k) || 0) + Number(l.valor)); } return m; };
  const curF = sumCat("saida_fixa", S.lancamentos), curV = sumCat("saida_variavel", S.lancamentos);
  const prevF = new Map(Object.entries(P.porCat?.saida_fixa || {})), prevV = new Map(Object.entries(P.porCat?.saida_variavel || {}));
  const nomeCat = k => { if (k === "__poup") return "🐷 Poupança"; const c = catById(k); return c ? `${c.icone || ""} ${c.nome}`.trim() : "Sem categoria"; };
  const linhas = (cur, prev, cor) => {
    const keys = [...new Set([...cur.keys(), ...prev.keys()])].map(k => [k, cur.get(k) || 0, prev.get(k) || 0]).sort((a, b) => b[1] - a[1] || b[2] - a[2]);
    const max = Math.max(1, ...keys.map(x => x[1]));
    return keys.map(([k, v, p]) => `<li class="erow"><span class="en">${esc(nomeCat(k))}</span><span class="ev num">${money(v)}</span><span class="bar"><i style="width:${(v / max * 100).toFixed(1)}%;background:${k === "__poup" ? COR.poup : cor}"></i></span><span class="ed num">${delta(v, p)}${temPrev ? `<span class="ep">${prevN}: ${money(p)}</span>` : ""}</span></li>`).join("");
  };
  const mercLinha = (() => { const v = t.mercado, p = P.mercado; if (!v && !p) return ""; return `<li class="erow"><span class="en">🛒 Mercado</span><span class="ev num">${money(v)}</span><span class="bar"><i style="width:${(v / Math.max(1, v, ...curV.values()) * 100).toFixed(1)}%;background:${COR.mercado}"></i></span><span class="ed num">${delta(v, p)}${temPrev ? `<span class="ep">${prevN}: ${money(p)}</span>` : ""}</span></li>`; })();
  // comparativo
  const comp = [["Entradas", t.entradas, P.entradas, "var(--green)", true], ["Gastos fixos", t.fixos, P.fixos, COR.fixos, false], ["Gastos variáveis", varTot, varPrev, COR.outros, false], [t.saldo >= 0 ? "Sobrou" : "Faltou", t.saldo, prevSaldo, "var(--ink)", true]];
  const cmax = Math.max(1, ...comp.flatMap(c => [Math.abs(c[1]), Math.abs(c[2])]));
  const vazio = !S.lancamentos.length && !S.compras.length;
  const html = shell("Resumo", `
    <section class="hero">
      <div class="lbl">${t.saldo >= 0 ? "Sobrou neste mês" : "Faltou neste mês"}</div>
      <div class="big num ${t.saldo >= 0 ? "in" : "out"}">${money(Math.abs(t.saldo))}</div>
      
    </section>
    ${vazio ? `<div class="empty"><strong>Comece pelo salário.</strong>Cadastre seu salário em Entradas e suas contas em Gastos fixos. Eles passam a entrar sozinhos todo mês.<br><br><a class="btn green" href="#/entradas">Cadastrar salário</a></div>` : `
    <section class="rings">
      <button type="button" class="ringcard" data-act="scrollTo" data-id="et-fixos" aria-label="Ver gastos fixos por categoria">
        <h2>Gastos fixos</h2>
        <div class="ringwrap">${donut("fixos", { total: t.fixos, base, label: "Gastos fixos", segs: [{ label: "Contas fixas", value: t.fixos - t.poupFixo, color: COR.fixos }, { label: "Poupança", value: t.poupFixo, color: COR.poup }] })}</div>
        <div class="rdelta num">${delta(t.fixos, P.fixos) || "&nbsp;"}</div>
      </button>
      <button type="button" class="ringcard" data-act="scrollTo" data-id="et-var" aria-label="Ver gastos variáveis por categoria">
        <h2>Gastos variáveis</h2>
        <div class="ringwrap">${donut("var", { total: varTot, base, label: "Gastos variáveis", segs: [{ label: "Mercado", value: t.mercado, color: COR.mercado }, { label: "Outros variáveis", value: t.variaveis, color: COR.outros }] })}</div>
        <div class="rdelta num">${delta(varTot, varPrev) || "&nbsp;"}</div>
      </button>
    </section>
    <ul class="leg num" style="justify-content:flex-start;flex-wrap:wrap;margin-top:10px"><li><i style="background:${COR.fixos}"></i>Contas fixas</li><li><i style="background:${COR.poup}"></i>Poupança</li><li><i style="background:${COR.mercado}"></i>Mercado</li><li><i style="background:${COR.outros}"></i>Outros variáveis</li></ul>`}
    ${!t.entradas && gastos ? `<p class="note">Cadastre suas entradas para ver quanto da renda cada gasto ocupa.</p>` : ""}

    <section class="block">
      <div class="bhead"><h2>Comparado a ${prevN}</h2><span class="cleg"><span><i class="sw cur"></i>${curN}</span><span><i class="sw prv"></i>${prevN}</span></span></div>
      ${temPrev ? `<ul class="cmp">${comp.map(([n, c, p, cor, bom]) => `<li><div class="ch"><span>${n}</span><span class="num">${delta(c, p, bom)}</span></div>
        <div class="cb"><i class="cur" style="width:${(Math.abs(c) / cmax * 100).toFixed(1)}%;background:${cor}" title="${curN}: ${money(c)}"></i><b class="num">${money(c)}</b></div>
        <div class="cb"><i class="prv" style="width:${(Math.abs(p) / cmax * 100).toFixed(1)}%;background:${cor}" title="${prevN}: ${money(p)}"></i><span class="num">${money(p)}</span></div></li>`).join("")}</ul>`
      : `<p class="note">Sem lançamentos em ${prevN} para comparar. O comparativo aparece a partir do segundo mês de uso.</p>`}
    </section>

    <section class="block" id="et-fixos">
      <div class="bhead"><h2>Gastos fixos</h2><b class="num">${money(t.fixos)}</b></div>
      ${curF.size || prevF.size ? `<ul class="etapas">${linhas(curF, prevF, COR.fixos)}</ul>` : `<p class="note">Nenhum gasto fixo neste mês.</p>`}
    </section>

    <section class="block" id="et-var">
      <div class="bhead"><h2>Gastos variáveis</h2><b class="num">${money(varTot)}</b></div>
      ${mercLinha || curV.size || prevV.size ? `<ul class="etapas">${mercLinha}${linhas(curV, prevV, COR.outros)}</ul>` : `<p class="note">Nenhum gasto variável neste mês.</p>`}
    </section>
  `);
  animateRings();
  return html;
}

function confirmPop({ title, text, ok = "Apagar", icon = "trash", tone = "danger" }) {
  return new Promise(res => {
    const d = $("#pop");
    d.innerHTML = `<div class="popbox" role="alertdialog" aria-labelledby="popT" aria-describedby="popX">
      <div class="popicon ${tone}">${I[icon] || I.trash}</div>
      <h3 id="popT">${title}</h3><p id="popX">${text}</p>
      <div class="popact"><button type="button" class="btn ${tone === "danger" ? "danger solid" : "green"}" data-c="1">${ok}</button><button type="button" class="btn ghost" data-c="0">Cancelar</button></div></div>`;
    let done = false;
    const fin = v => { if (done) return; done = true; if (d.open) d.close(); res(v); };
    d.onclose = () => fin(false);
    let down = false; d.onpointerdown = e => { down = e.target === d; };
    d.onclick = e => { if (e.target === d && down) fin(false); down = false; };
    d.querySelectorAll("[data-c]").forEach(b => b.onclick = () => fin(b.dataset.c === "1"));
    d.showModal(); d.querySelector('[data-c="0"]').focus();
  });
}

/* ===================== Entradas e saídas ===================== */
const tipoCat = tipo => tipo === "saida_fixa" ? "fixo" : "variavel";
function mesesPagos(l) {
  const y = S.month.getFullYear();
  const hist = (S.histFixos || []).filter(h => l.recorrencia_id ? h.recorrencia_id === l.recorrencia_id : h.id === l.id);
  if (!hist.some(h => h.id === l.id)) hist.push(l);
  const porMes = new Map(); for (const h of hist) { const d = dParts(h.data); if (d.getFullYear() === y) porMes.set(d.getMonth(), h); }
  const rec = l.recorrencia_id ? S.recorrencias.find(r => r.id === l.recorrencia_id) : null;
  const hoje = todayISO();
  const cells = MES.map((nome, m) => {
    const h = porMes.get(m), ms = monthStart(new Date(y, m, 1));
    let st;
    if (h) st = h.pago || (l.tipo === "guardar" && depositoFeito(h)) ? "ok" : h.data < hoje ? "late" : "wait";
    else if (rec && rec.ativo !== false && ms >= monthStart(dParts(rec.inicio)) && (!rec.fim || ms <= rec.fim)) st = ms < monthStart(dParts(hoje)) ? "late" : "wait";
    else st = "none";
    const tip = { ok: "pago", late: "não pago", wait: "a pagar", none: "sem cobrança" }[st];
    const cls = `mc ${st}${h && h.id === S.justPaid ? " just" : ""}${m === S.month.getMonth() ? " cur" : ""}`;
    if (l.tipo !== "saida_fixa" || st === "none") return `<span class="${cls}" title="${nome}: ${tip}" aria-label="${nome}: ${tip}">${nome}</span>`;
    return `<button type="button" class="${cls}" data-act="pagarMes" data-id="${l.id}" data-m="${m}" aria-pressed="${st === "ok"}" title="${nome}: ${tip}" aria-label="${nome}: ${tip}">${nome}</button>`;
  });
  return `<div class="mstrip" aria-label="Pagamentos em ${y}">${cells.join("")}</div>`;
}
/* Quantos meses um gasto fixo ainda repete (fim = último dia do último mês) */
const mesesEntre = (a, b) => (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
const recDe = l => l?.recorrencia_id ? S.recorrencias.find(r => r.id === l.recorrencia_id) : null;
function mesesRestantes(l) { const r = recDe(l); return r?.fim ? Math.max(0, mesesEntre(dParts(l.data), dParts(r.fim))) : null; }
const fimDepois = (dataIso, n) => monthEnd(new Date(dParts(dataIso).getFullYear(), dParts(dataIso).getMonth() + n - 1, 1));
function restanteTxt(l) { const n = mesesRestantes(l); return n == null ? "" : n === 0 ? " · último mês" : ` · mais ${n} ${n === 1 ? "mês" : "meses"}`; }
async function definirFim(rec, fim) {
  rec.fim = fim; await write({ t: "update", table: "recorrencias", id: rec.id, row: { fim } });
  if (!fim) return;
  // lançamentos já criados depois do fim e ainda não pagos saem
  const sobra = [...new Set([...(S.histFixos || []), ...S.lancamentos].filter(x => x.recorrencia_id === rec.id && x.data > fim && !x.pago).map(x => x.id))];
  for (const id of sobra) await write({ t: "delete", table: "lancamentos", id });
  const fora = x => sobra.includes(x.id);
  S.lancamentos = S.lancamentos.filter(x => !fora(x)); S.histFixos = (S.histFixos || []).filter(x => !fora(x));
}

    <div class="field"><label for="en">Anotação (opcional)</label><textarea id="en" rows="2" placeholder="Endereço, o que levar, contato…">${esc(ini.nota || "")}</textarea></div>

  const repAtual = () => $('#fEv input[name="erep"]:checked')?.value || "nao";

  $$('#fEv input[name="erep"]').forEach(x => x.onchange = fr); fr();
  $("#ehi").addEventListener("change", () => { const a = $("#ehi").value, b = $("#ehf"); if (a && (!b.value || b.value <= a)) { const m = Math.min(minDe(a) + 60, 23 * 60 + 59); b.value = `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; } });

    const row = { titulo, data, dia_todo: dia_todo || !hi, hora_ini: hi, hora_fim: hf, cor, nota: $("#en").value.trim() || null, repete: r, dias, ate };
    if (e) { Object.assign(e, row); await write({ t: "update", table: "eventos", id: e.id, row }); }
    else { const novo = { id: uuid(), user_id: S.user.id, ...row }; (S.eventos ||= []).push(novo); await write({ t: "insert", table: "eventos", row: novo }); }
    if (!ocorre(row, S.agDia)) S.agDia = data;
    saveCache(); closeSheet(); render(); toast(r === "nao" ? "Compromisso salvo" : "Rotina salva");
  };
}
async function apagarEv(id) {
  const e = (S.eventos || []).find(x => x.id === id); if (!e) return;
  const rp = repete(e);
  if (!await confirmPop({ title: "Deseja realmente apagar este compromisso?", text: `<b translate="no">${esc(e.titulo)}</b> · ${rp ? repTxt(e) : dShort(e.data)} · ${horario(e)}. ${rp ? "Todas as repetições saem da agenda." : "Ele sai da sua agenda."}`, ok: "Sim, apagar" })) return;
  S.eventos = S.eventos.filter(x => x.id !== id); await write({ t: "delete", table: "eventos", id }); saveCache(); closeSheet(); render(); toast("Compromisso apagado");
}
