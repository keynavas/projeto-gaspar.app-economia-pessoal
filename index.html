/* ===================== Assinatura (7 dias grátis, depois R$ 19,90/mês) ===================== */
const PRECO_PADRAO = "R$ 19,90", GOOGLE_SKU = "gaspar_mensal", GOOGLE_PKG = "app.gaspar.twa", DIA_MS = 864e5;
function statusAssinatura() {
  const a = S.assin; if (!a) return null;
  const fim = Date.parse(a.fim), agora = Date.now();
  if (a.status === "ativa") return fim + 2 * DIA_MS > agora ? "ativa" : "vencida";
  if (a.status === "teste" || a.status === "cancelada") return fim > agora ? a.status : "vencida";
  return "vencida";
}
const temAcesso = () => !S.assin || statusAssinatura() !== "vencida";
const diasRestantes = () => Math.max(0, Math.ceil((Date.parse(S.assin?.fim) - Date.now()) / DIA_MS));
const dataFim = () => dParts(S.assin.fim.slice(0, 10)).toLocaleDateString(LOC, { day: "numeric", month: "long" });
function resumoAssinatura() {
  const st = statusAssinatura(), d = diasRestantes();
  return st === "teste" ? (d === 1 ? "Teste · 1 dia" : `Teste · ${d} dias`) : st === "ativa" ? "Ativa" : st === "cancelada" ? `Até ${dShort(S.assin.fim.slice(0, 10))}` : "Vencida";
}
function faixaAssinatura() {
  const st = statusAssinatura(); if (!st) return "";
  const d = diasRestantes();
  if (st === "teste") return `<a class="faixa-as" href="#/assinatura"><span>${d <= 1 ? "Último dia do seu teste grátis" : `Faltam ${d} dias do seu teste grátis`}</span><span class="fa-b">Assinar</span></a>`;
  if (st === "cancelada" && d <= 5) return `<a class="faixa-as" href="#/assinatura"><span>Seu acesso vai até <b>${dataFim()}</b></span><span class="fa-b">Reativar</span></a>`;
  return "";
}
// --- Google Play Billing (só existe dentro do app baixado da Play Store) ---
let googleSvc;
async function servicoGoogle() {
  if (googleSvc !== undefined) return googleSvc;
  googleSvc = null;
  if ("getDigitalGoodsService" in window) { try { googleSvc = await window.getDigitalGoodsService("https://play.google.com/billing"); } catch {} }
  return googleSvc;
}
async function precoGoogle() {
  const s = await servicoGoogle(); if (!s) return null;
  try { const [d] = await s.getDetails([GOOGLE_SKU]); return d ? new Intl.NumberFormat(LOC, { style: "currency", currency: d.price.currency, currencyDisplay: "narrowSymbol" }).format(Number(d.price.value)) : null; } catch { return null; }
}
async function erroFuncao(error, data) {
  if (data?.erro) return data.erro;
  try { const j = await error?.context?.json(); if (j?.erro) return j.erro; } catch {}
  return error?.message || "Tente de novo em instantes.";
}
async function confirmarGoogle(purchaseToken) {
  const { data, error } = await sb.functions.invoke("google-verificar", { body: { purchaseToken, productId: GOOGLE_SKU } });
  if (error || !data?.assinatura) throw new Error(await erroFuncao(error, data));
  S.assin = data.assinatura;
}
async function restaurarGoogle() {
  if (S.restaurouGoogle) return; S.restaurouGoogle = true;
  const s = await servicoGoogle(); if (!s) return;
  try {
    const c = (await s.listPurchases()).find(p => p.itemId === GOOGLE_SKU);
    if (c && !(statusAssinatura() === "ativa" && S.assin?.google_purchase_token === c.purchaseToken)) { await confirmarGoogle(c.purchaseToken); render(); }
  } catch {}
}
async function recarregarAssinatura() { const a = await sb.rpc("iniciar_teste"); if (!a.error) S.assin = a.data?.[0] || S.assin; }
async function assinar(btn) {
  if (!navigator.onLine) return toast("Conecte-se à internet para assinar.");
  const txt = btn.innerHTML; btn.disabled = true; btn.textContent = traduzTexto("Abrindo pagamento…");
  try {
    const g = await servicoGoogle();
    if (g) {
      const req = new PaymentRequest([{ supportedMethods: "https://play.google.com/billing", data: { sku: GOOGLE_SKU } }], { total: { label: "Total", amount: { currency: "BRL", value: "0" } } });
      const resp = await req.show();
      const { purchaseToken } = resp.details; await resp.complete("success");
      btn.textContent = traduzTexto("Confirmando com o Google…");
      await confirmarGoogle(purchaseToken);
      toast("Assinatura ativa! Obrigado por assinar o Gaspar."); location.hash = "#/resumo"; render(); return;
    }
    const { data, error } = await sb.functions.invoke("stripe-checkout");
    if (error || (!data?.url && !data?.previa)) throw new Error(await erroFuncao(error, data));
    if (data.url) { location.href = data.url; return; }
    await recarregarAssinatura(); toast("Prévia: assinatura simulada como ativa."); location.hash = "#/resumo"; render();
  } catch (e) {
    if (e?.name === "AbortError") { /* a pessoa fechou a tela de pagamento */ }
    else toast(`Não foi possível assinar: ${e.message || e}`);
  } finally { if (btn.isConnected) { btn.disabled = false; btn.innerHTML = txt; } }
}
async function gerenciarAssinatura(btn) {
  const a = S.assin; if (!a) return;
  if (a.plataforma === "google") { window.open(`https://play.google.com/store/account/subscriptions?sku=${GOOGLE_SKU}&package=${GOOGLE_PKG}`, "_blank", "noopener"); return; }
  if (await servicoGoogle()) return toast("Esta assinatura foi feita pelo site. Para gerenciar, abra o Gaspar no navegador.");
  btn.disabled = true;
  try {
    const { data, error } = await sb.functions.invoke("stripe-portal");
    if (error || (!data?.url && !data?.previa)) throw new Error(await erroFuncao(error, data));
    if (data.url) { location.href = data.url; return; }
    await recarregarAssinatura(); toast("Prévia: renovação alterada."); render();
  } catch (e) { toast(`Não foi possível abrir: ${e.message || e}`); }
  finally { if (btn.isConnected) btn.disabled = false; }
}

function pctMsg(pct) {
  if (pct < 15) return "Um bom começo. Quando der, tente chegar aos 20%.";
  if (pct < 20) return "Quase lá: 20% é o recomendado para criar uma reserva sólida.";
  if (pct === 20) return "Recomendado: guardar 20% do salário equilibra o hoje e o futuro.";
  if (pct <= 30) return "Ótimo ritmo: você está acima do recomendado.";
  return "Ritmo forte. Confira se os gastos fixos e variáveis ainda cabem no mês.";
}
function anosHtml(mensal) {

  const max = Math.max(1, ...anos.map(x => x.final));
  return anos.map(x => `<div class="ano" title="${x.a} ${x.a === 1 ? "ano" : "anos"}: ${money(x.final)} (${money(x.depositado)} guardados + ${money(x.rendimento)} de rendimento)">

}

  sheet(`<form id="fPoup">${sheetHead(l ? (g ? `Depósito de ${dParts(l.data).toLocaleDateString(LOC, { month: "long" })}` : "Editar") : g ? "Guardar dinheiro" : "Retirar da poupança")}

async function exportar() {

  const comp = Object.fromEntries((c.data || []).map(x => [x.id, x]));
  const rows = [["tipo", "data", "descricao", "categoria", "quantidade", "preco_unitario", "valor"]];
  for (const x of l.data || []) rows.push([x.tipo, x.data, x.descricao, catById(x.categoria_id)?.nome || "", "", "", x.valor]);
  for (const x of i.data || []) rows.push(["mercado" + (comp[x.compra_id]?.mercado ? " - " + comp[x.compra_id].mercado : ""), comp[x.compra_id]?.data || "", x.produto, catById(x.categoria_id)?.nome || "", x.quantidade ?? "", x.preco_unitario ?? "", x.total]);
  const cell = v => { const t = String(v ?? ""); return /^-?\d+(\.\d+)?$/.test(t) ? t.replace(".", ",") : `"${t.replace(/"/g, '""')}"`; };
  const csv = rows.map((r, i) => r.map(v => i && /^\d{4}-/.test(String(v)) ? v : cell(v)).join(";")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" })); a.download = `gaspar-backup-${todayISO()}.csv`; a.click();
}

    case "tema": { const novo = temaAtual() === "dark" ? "light" : "dark"; document.documentElement.classList.add("tema-anim"); aplicarTema(novo); render(); if (S.user && !S.loaded) {} setTimeout(() => document.documentElement.classList.remove("tema-anim"), 400); toast(novo === "dark" ? "Modo escuro" : "Modo claro"); break; }
    case "verTodosGastos": S.verTodosGastos = !S.verTodosGastos; render(); break;
    case "verTodasCats": S.verTodasCats = !S.verTodasCats; render(); break;
    case "verTodasAbas": S.verTodasAbas = !S.verTodasAbas; render(); break;
    case "scrollTo": document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" }); break;
    case "novoItem": formItem(); break;
    case "editItem": formItem((S.itens[route()[1]] || []).find(i => i.id === id)); break;
    case "agDia": S.agDia = id; render(); break;
    case "agModo": S.agModo = id; render(); break;
    case "agNav": { const n = Number(id); if (S.agModo === "mes") { const d = dParts(S.agDia); const alvo = new Date(d.getFullYear(), d.getMonth() + n, 1); S.agDia = isoDe(alvo); } else S.agDia = somaDias(S.agDia, 7 * n); render(); break; }
    case "agHora": formEv(null, { data: S.agDia, h: Number(b.dataset.h) }); break;
    case "agCor": S.agCor = id || null; render(); break;
    case "novoEv": formEv(null); break;
    case "editEv": formEv(S.eventos.find(x => x.id === id)); break;
    case "delEv": apagarEv(id); break;
    case "novoLanc": formLanc(null, { tipo: b.dataset.tipo, categoria_id: b.dataset.cat || null }); break;
    case "varTab": location.hash = `#/variaveis/${id}`; setTimeout(() => $("#varSec")?.scrollIntoView({ behavior: "smooth", block: "start" }), 80); break;
    case "editLanc": { const l = S.lancamentos.find(x => x.id === id); if (l && (l.tipo === "guardar" || l.tipo === "resgatar")) formPoup(l); else formLanc(l); break; }
    case "guardar": formPoup(null, "guardar"); break;
    case "retirar": formPoup(null, "resgatar"); break;
    case "editMeta": formMeta(); break;
    case "editDep": formDep(Number(id)); break;
    case "editRec": formRec(S.recorrencias.find(r => r.id === id)); break;
    case "pagar": {
      const l = S.lancamentos.find(x => x.id === id); l.pago = !l.pago;
      const pmv = (S.poupMov || []).find(x => x.id === id); if (pmv) pmv.pago = l.pago;
      const h = (S.histFixos ||= []).find(x => x.id === id); if (h) h.pago = l.pago; else S.histFixos.push({ id, recorrencia_id: l.recorrencia_id, pago: l.pago, data: l.data, descricao: l.descricao });
      S.justPaid = l.pago ? id : null; render(); S.justPaid = null;
      toast(l.tipo === "guardar" ? (l.pago ? `Guardado! Reserva: ${money(poup().reserva)}` : "Marcado como não guardado") : l.pago ? `${l.descricao}: pago em ${dParts(l.data).toLocaleDateString(LOC, { month: "long" })}` : `${l.descricao}: marcado como não pago`);
      await write({ t: "update", table: "lancamentos", id, row: { pago: l.pago } }); saveCache(); break; }
    case "umenu": abrirConta(!S.umenu); break;
    case "pagarMes": {   // toque no mês da faixa: marca/desmarca o pagamento daquele mês
      const l = S.lancamentos.find(x => x.id === id); if (!l) return;
      const y = S.month.getFullYear(), m = Number(b.dataset.m), ms = monthStart(new Date(y, m, 1)), nomeMes = new Date(y, m, 1).toLocaleDateString(LOC, { month: "long" });
      let h = (S.histFixos || []).find(x => (l.recorrencia_id ? x.recorrencia_id === l.recorrencia_id : x.id === l.id) && x.data.slice(0, 7) === ms.slice(0, 7));
      if (h) {
        h.pago = !h.pago;
        for (const arr of [S.lancamentos, S.poupMov || []]) for (const x of arr) if (x.id === h.id) x.pago = h.pago;
        S.justPaid = h.pago ? h.id : null; render(); S.justPaid = null;
        toast(h.pago ? `${l.descricao}: pago em ${nomeMes}` : `${l.descricao}: marcado como não pago`);
        await write({ t: "update", table: "lancamentos", id: h.id, row: { pago: h.pago } }); saveCache(); break;
      }
      const rec = l.recorrencia_id ? S.recorrencias.find(r => r.id === l.recorrencia_id) : null; if (!rec) return;
      const ult = new Date(y, m + 1, 0).getDate();
      const lan = { id: uuid(), user_id: S.user.id, tipo: "saida_fixa", descricao: rec.descricao, valor: Number(rec.valor), data: `${ms.slice(0, 8)}${String(Math.min(rec.dia_do_mes || 1, ult)).padStart(2, "0")}`, pago: true, categoria_id: rec.categoria_id ?? null, recorrencia_id: rec.id, competencia: ms };
      (S.histFixos ||= []).push({ ...lan }); if (ms === monthStart(S.month)) S.lancamentos.push({ ...lan });
      S.justPaid = lan.id; render(); S.justPaid = null; toast(`${l.descricao}: pago em ${nomeMes}`);
      await write({ t: "insert", table: "lancamentos", row: lan }); saveCache(); break; }
    case "catTab": S.catTab = b.dataset.tab; render(); break;
    case "novaCat": formCat(); break;
    case "editCat": formCat(S.categorias.find(c => c.id === id)); break;
    case "restaurar": { if (!await confirmPop({ title: "Tem certeza que deseja restaurar as categorias padrão?", text: "As categorias padrão que você apagou voltam. As que você criou ou renomeou continuam como estão.", ok: "Sim, restaurar", icon: "edit", tone: "warn" })) return; const { error } = await sb.rpc("restaurar_categorias_padrao"); if (error) return toast(error.message); await loadAll(); saveCache(); render(); toast("Categorias padrão restauradas"); break; }
    case "exportar": exportar(); break;
    case "apagarConta": formApagarConta(); break;
    case "suporte": abrirConta(false); abrirSuporte(); break;
    case "jaConfirmei": {
      if (!authSenha) { authMode = "login"; authMsg = { ok: true, text: "Entre com seu e-mail e senha." }; renderAuth(); break; }
      b.disabled = true;
      if (typeof PREVIEW !== "undefined") await sb.auth.__confirmar(authEmail);   // prévia: simula o clique no link
      const { error } = await sb.auth.signInWithPassword({ email: authEmail, password: authSenha });
      if (error) { b.disabled = false; authMsg = { text: /not confirmed/i.test(error.message) ? "Ainda não recebemos a confirmação. Toque no link do e-mail e tente de novo." : traduz(error.message) }; renderAuth(); }
      else { S.boasVindas = true; authSenha = ""; authMode = "login"; authMsg = null; }
      break; }
    case "assinar": assinar(b); break;
    case "gerenciarAssinatura": gerenciarAssinatura(b); break;
    case "supTema": formSuporte(Number(id)); break;
    case "copiarSuporte": try { await navigator.clipboard.writeText(SUPORTE_EMAIL); toast("E-mail copiado"); } catch { toast(SUPORTE_EMAIL); } break;
    case "sair": abrirConta(false); if (!await confirmPop({ title: "Tem certeza que deseja sair?", text: `Você vai sair da conta <b>${esc(S.user.email)}</b> neste aparelho. Seus dados continuam salvos.`, ok: "Sim, sair", icon: "entradas", tone: "warn" })) return;
      // envia o que estiver pendente e apaga a cópia local dos dados deste aparelho
      try { if (navigator.onLine) await flush(); } catch {}
      try { localStorage.removeItem(cacheKey()); if (!JSON.parse(localStorage.getItem(QK()) || "[]").length) localStorage.removeItem(QK()); } catch {}
      await sb.auth.signOut(); break;
  }
});
let downNoFundo = false;
$("#sheet").addEventListener("pointerdown", e => { downNoFundo = e.target.id === "sheet"; });
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet" && downNoFundo) closeSheet(); downNoFundo = false; });

/* ===================== Boot ===================== */
let starting = null;
async function start(session) {
  const u = session?.user || null;
  if (u && u.id === S.user?.id && (S.loaded || starting === u.id)) return;
  if (!u && !S.user && document.querySelector("#authForm")) return;
  S.user = u; S.loaded = false; starting = u?.id || null;
  if (!u) return render();
  render();
  try { await loadAll(); } catch (e) { if (!loadCache()) toast("Sem conexão. Conecte-se à internet para o primeiro acesso."); }
  S.loaded = true; starting = null; if (!GRATUITO) restaurarGoogle();
  await loadMonth();
  if (await garantirPlano()) render();
}
montarTraducao(); document.documentElement.lang = LOC; traduzArvore(document.body);
sb.auth.onAuthStateChange((ev, session) => {
  if (S.codigoFluxo) return;
  if (ev === "SIGNED_OUT") { authMode = "login"; authMsg = S.contaApagada ? { ok: true, text: "Sua conta e todos os seus dados foram apagados do Gaspar." } : S.semAceite ? { ok: false, text: "Para usar o Gaspar é preciso aceitar a política de privacidade." } : null; S.contaApagada = false; S.semAceite = false; }
  if (ev === "PASSWORD_RECOVERY") { S.recuperando = true; authMode = "nova"; authMsg = null; setTimeout(renderAuth, 0); return; }
  if (S.recuperando) return;
  if (ev === "SIGNED_IN" && S.boasVindas) { S.boasVindas = false; setTimeout(() => toast("E-mail confirmado! Bem-vindo ao Gaspar."), 600); }
  if (ev === "SIGNED_IN" && URL_AUTH.tipo === "signup") { URL_AUTH.tipo = null; history.replaceState(null, "", location.pathname + "#/resumo"); setTimeout(() => toast("E-mail confirmado! Bem-vindo ao Gaspar."), 600); }
  setTimeout(() => start(session), 0);
});
sb.auth.getSession().then(({ data }) => start(data.session));
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
